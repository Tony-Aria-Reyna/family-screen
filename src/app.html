<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Screen</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#9fd8cf">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#faf7f2; --card:#ffffff; --ink:#2b2f3a; --muted:#7a7f8c; --line:#ece6dc; --soft:#f4efe8;
  --accent:#9fd8cf; --accent-deep:#5fb3a6; --danger:#c2453b; --r:20px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:20px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:1fr 400px;height:100vh;padding:14px;gap:12px}
.leftcol{display:grid;grid-template-rows:auto auto 1fr;gap:12px;min-height:0;min-width:0}
.calbody{flex:1;min-height:0;display:flex;flex-direction:column}
.calbody>.week{flex:1}
.calhead{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}
.calhead .lbl{font-size:19px;font-weight:800;margin-right:auto;padding-left:6px}
.calhead .arrow{background:var(--soft);border-radius:999px;width:40px;height:40px;font-size:22px}
.calhead .pill{background:var(--soft);border-radius:999px;padding:7px 14px;font-size:16px}
.calhead .seg{background:var(--soft)}

/* ---------- top bar & clocks ---------- */
.top{display:flex;align-items:center;gap:10px;min-width:0}
.cc{position:relative;overflow:hidden;flex:1 1 0;min-width:215px;max-width:310px;height:112px;border-radius:24px;padding:10px 16px;display:flex;flex-direction:column;justify-content:center;text-align:left;box-shadow:0 2px 0 rgba(0,0,0,.04);transition:background 1s}
.cc .city{font-size:16px;font-weight:700;letter-spacing:.01em;position:relative;z-index:2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100% - 40px)}
.cc .time{font-size:40px;font-weight:800;line-height:1.02;font-variant-numeric:tabular-nums;letter-spacing:-1px;position:relative;z-index:2}
.cc .time small{font-size:20px;font-weight:700;margin-left:3px;letter-spacing:0}
.cc .sub{font-size:14px;font-weight:600;opacity:.85;position:relative;z-index:2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc .orb{position:absolute;width:30px;height:30px;border-radius:50%;z-index:1;transition:left 1s,top 1s}
.cc .orb.sun{background:radial-gradient(circle at 35% 35%,#fff6c4,#ffd45c 60%,#ffbf3c);box-shadow:0 0 22px 8px rgba(255,214,92,.55)}
.cc .orb.moon{background:#fbf6df;box-shadow:inset -9px -4px 0 0 #e3ddc0,0 0 18px 4px rgba(255,255,255,.25)}
.cc .stars{position:absolute;inset:0;z-index:0;opacity:0;transition:opacity 1s}
.cc .stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.85}
.cc.night .stars{opacity:1}
.cc .hill{position:absolute;right:-30px;bottom:-40px;width:170px;height:80px;border-radius:50%;z-index:1;opacity:.55}
.cc.dawn{background:linear-gradient(160deg,#ffd9cf,#ffeccc)}
.cc.day{background:linear-gradient(160deg,#cfe9f8,#eef8fd)}
.cc.dusk{background:linear-gradient(160deg,#f7c6d5,#d9c9f6)}
.cc.night{background:linear-gradient(160deg,#2f3571,#4d509a);color:#fff}
.cc.dawn .hill{background:#f3b9a6}.cc.day .hill{background:#b9e2c6}.cc.dusk .hill{background:#c4a9e6}.cc.night .hill{background:#262a5c}
.cc .badge{position:absolute;right:12px;top:10px;z-index:3;font-size:13px;font-weight:700;background:rgba(255,255,255,.7);color:var(--ink);border-radius:999px;padding:3px 9px}
.globebtn{width:92px;height:112px;border-radius:24px;flex:none;background:radial-gradient(circle at 35% 30%,#d6f0ff,#9ccfe8 55%,#7fb6d6);font-size:42px;display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.05);position:relative}
.globebtn span{position:absolute;bottom:7px;left:3px;right:3px;text-align:center;line-height:1.1;font-size:10px;font-weight:800;color:#1f4d66;letter-spacing:.04em}
.spacer{flex:1}
.iconbtn{background:var(--card);border-radius:16px;padding:14px 14px;font-size:24px;flex:none;box-shadow:0 1px 0 var(--line)}
.bigadd b{font-size:40px;font-weight:800}
.bigadd{display:flex;align-items:center;gap:8px;height:112px;line-height:1.1;text-align:left;background:var(--accent);border-radius:var(--r);padding:0 18px;font-size:19px;font-weight:800;white-space:nowrap}

/* ---------- people + nav ---------- */
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:flex;align-items:center;gap:7px;background:var(--card);border-radius:999px;padding:7px 13px 7px 9px;font-size:17px}
.dot{width:22px;height:22px;border-radius:50%;display:inline-block;flex:none;border:1px solid rgba(0,0,0,.06)}
.chip.off{opacity:.38}
.nav{margin-left:auto;display:flex;gap:6px;align-items:center}
.nav .pill{background:var(--card);border-radius:999px;padding:8px 16px;font-size:17px}
.nav .arrow{background:var(--card);border-radius:999px;width:44px;height:44px;font-size:22px}
.nav .lbl{font-size:17px;font-weight:700;min-width:100px;text-align:center}
.seg{display:flex;background:var(--card);border-radius:999px;padding:4px}
.seg button{padding:7px 16px;border-radius:999px;font-size:17px}
.seg button.on{background:var(--ink);color:#fff}

/* ---------- main layout ---------- */
.right{display:grid;grid-template-rows:1fr 1.1fr;gap:12px;min-height:0}
@media (min-width:1500px){ .app{grid-template-columns:1fr 340px 360px} .right{display:contents} }
.panel{background:var(--card);border-radius:var(--r);min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.ph{display:flex;align-items:center;gap:10px;padding:10px 14px 2px}
.ph .tip{font-size:12px;color:var(--muted);margin-left:auto;text-align:right;line-height:1.2;max-width:150px}
.split{display:none}
#todoPanel,#shopPanel{container-type:inline-size}
@container (max-width:400px){ .ph .tip{display:none} }
@media (max-width:900px){ .hidep{display:none} }
.hidep{position:absolute;top:8px;right:8px;z-index:3;background:var(--soft);border-radius:10px;width:30px;height:30px;font-size:17px;line-height:1;color:var(--muted);flex:none}
.hidep:hover{background:#e9e2d6;color:var(--ink)}
@media (min-width:901px){ #todoPanel .ph,#shopPanel .ph{padding-right:44px;flex-wrap:wrap;row-gap:4px} }
@container (max-width:320px){ .ph h2{font-size:22px} }
.dock{display:none}
.dockp{flex:1;min-height:0;background:var(--card);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0;box-shadow:0 1px 0 var(--line);overflow:hidden}
.dockp:hover{background:#fffdf8}
.dockp .chev{font-size:17px;color:var(--muted);background:var(--soft);border-radius:10px;width:30px;height:30px;line-height:30px;flex:none}
.dockp .vt{writing-mode:vertical-rl;font-weight:800;font-size:17px;white-space:nowrap;letter-spacing:.3px}
.dockp .n{font-size:13px;font-weight:800;color:var(--muted)}
.restorep{background:var(--card);border-radius:12px;padding:7px 12px;font-size:15px;font-weight:700;box-shadow:0 1px 0 var(--line);white-space:nowrap}
@media (min-width:901px){
  .app{column-gap:0}
  .split{display:block;cursor:col-resize;position:relative;touch-action:none;min-width:14px}
  .split::after{content:'';position:absolute;left:5px;width:4px;top:calc(50% - 30px);height:60px;border-radius:4px;background:#ddd5c8;transition:background .15s}
  .split:hover::after,.split.drag::after{background:#8fb8ad}
  .app.hideT #todoPanel,.app.hideS #shopPanel,.app.hideT .split[data-split=b],.app.hideS .split[data-split=b]{display:none}
  .app.hideT.hideS .right,.app.hideT.hideS .split{display:none}
  .app.hideT .dock,.app.hideS .dock{display:flex;flex-direction:column;gap:12px;margin-left:10px;min-height:0}
  .app.hideT .right,.app.hideS .right{grid-template-rows:1fr}
}
@media (min-width:901px) and (max-width:1499px){ .split[data-split=b]{display:none} .right{margin:0} }
.ph .clr{background:var(--soft);border-radius:10px;padding:6px 10px;font-size:13px;flex:none}
.ph h2{margin:0;font-size:22px;white-space:nowrap}
.ph .n{color:var(--muted);font-size:16px}

/* ---------- week ---------- */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));height:100%;min-height:0}
.day{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;transition:background .12s}
.day:last-child{border-right:0}
.day h3{margin:0;padding:12px 10px 8px;font-size:16px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
.day h3 b{display:block;font-size:25px;color:var(--ink);white-space:nowrap}
.day.today h3{background:#e8f6f3}
.day.today h3 b{color:#2f8f82}
.day.wkend{background:#fdfbf8}
.evs{padding:7px;display:flex;flex-direction:column;gap:7px;overflow-y:auto;flex:1}
.ev{border-radius:12px;padding:7px 9px;font-size:17px;line-height:1.2;text-align:left;width:100%;color:var(--ink);position:relative}
.ev small{display:block;font-size:13px;opacity:.75;font-weight:700}
.ev .dots{display:flex;gap:3px;margin-top:5px}
.ev .dots i{width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.9)}
.addday{margin-top:auto;color:var(--muted);font-size:16px;padding:8px;border-top:1px dashed var(--line)}
body.dragging [data-drop],body.dragging [data-shopdrop]{outline:2px dashed #cfe9e4;outline-offset:-3px}
.drop-on{background:#e0f3ef !important;outline:3px dashed var(--accent-deep) !important;outline-offset:-3px}
/* month */
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mhead{font-size:15px;color:var(--muted);text-align:center;padding:6px;border-bottom:1px solid var(--line)}
.mbody{flex:1;min-height:0;grid-auto-rows:1fr}
.mcell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;overflow:hidden;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:0}
.mcell .n{font-size:18px;font-weight:700}
.mcell.today .n{background:var(--accent);border-radius:999px;width:32px;text-align:center}
.mcell.other{background:#fbf9f5;color:var(--muted)}
.mpill{font-size:13px;border-radius:6px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}

/* ---------- lists ---------- */
.addrow{display:flex;gap:8px;padding:6px 14px 6px}
.addrow input{flex:1;min-width:0;border:2px solid var(--line);border-radius:14px;padding:9px 14px;font-size:19px;user-select:text;-webkit-user-select:text;background:#fff}
.addrow button{background:var(--accent);border-radius:14px;padding:0 18px;font-size:26px;font-weight:800}
.shops{display:flex;gap:5px;flex-wrap:wrap;padding:0 14px 6px}
.shops button{border-radius:999px;padding:4px 10px;font-size:14px;background:var(--soft);white-space:nowrap;display:flex;align-items:center;gap:6px}
.shops button .dot{width:12px;height:12px}
.shops button.on{background:var(--ink);color:#fff}
.hint{font-size:13px;color:var(--muted);padding:0 16px 6px}
.list{overflow-y:auto;flex:1;padding:0 8px 8px}
.grp{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 8px 4px;font-weight:800;display:flex;align-items:center;gap:8px;border-radius:10px}
.grp .tag{width:12px;height:12px;border-radius:4px}
.item{display:flex;align-items:center;gap:12px;padding:7px 8px;border-bottom:1px solid var(--line);width:100%;text-align:left;font-size:20px;background:#fff;border-radius:8px;cursor:pointer}
.item.lifted{opacity:.35}
.box{width:32px;height:32px;border-radius:9px;border:3px solid #c9c1b4;flex:none;display:grid;place-items:center;font-size:19px;background:#fff}
.done .box{background:var(--accent);border-color:var(--accent-deep)}
.done .nm{text-decoration:line-through;color:var(--muted)}
.item .nm{flex:1;min-width:0}
.item .sub{font-size:13px;color:var(--muted);text-align:right}
.item .who{font-size:13px;color:var(--muted);display:block}
.tchips{display:flex;gap:6px;overflow-x:auto;padding:2px 10px 6px;scrollbar-width:none}
.tchip{flex:none;border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font:inherit;font-size:15px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.tchip b{font-weight:800}.tchip small{color:#15803d;font-size:12px;font-weight:700}
.tchip.on{border-color:var(--ink);background:#fff7d6}
.tchip .dot{width:11px;height:11px;border-radius:50%;display:inline-block}
.twho[hidden]{display:none}.twho{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:2px 10px 8px}.twho span{font-weight:800;font-size:14px;color:#92400e;margin-right:2px}
.twho button{display:flex;align-items:center;gap:5px;border:2px solid var(--c,#cbd5e1);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:15px;font-weight:700}.twho button i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.twho.ask{animation:askpulse .6s 2}@keyframes askpulse{50%{background:#fff3c4;border-radius:12px}}
.tbulk{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:4px 12px 8px;font-size:14px;color:var(--muted)}.tbulk button{background:#ffe5a8;border-radius:12px;padding:7px 12px;font:inherit;font-weight:800;font-size:14px}
.tlock{background:#f1f5f9!important;color:inherit!important;font-size:20px!important}
.tlock.on{background:#ffe5a8!important}
.tprivnote{font-size:13px;color:#92400e;padding:0 12px 4px}
.item .cal{background:var(--soft);border-radius:12px;padding:7px 10px;font-size:15px;flex:none}
.foot{padding:8px 14px;border-top:1px solid var(--line);display:flex;gap:10px}
.foot button{background:var(--soft);border-radius:12px;padding:9px 14px;font-size:15px}
.tray{position:absolute;left:0;right:0;bottom:0;top:96px;background:rgba(250,247,242,.97);z-index:6;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start;overflow:auto}
.tray .tt{grid-column:1/-1;font-size:15px;font-weight:800;color:var(--muted)}
.tile{border-radius:16px;padding:16px 14px;font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px;border:3px dashed rgba(0,0,0,.08)}
.sect{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 8px 4px;font-weight:800}
.sect.warn{color:#b45309}
.chk{background:#fff7e6;border-radius:14px;margin:4px 0;padding:8px 10px;border:2px solid #fde3b0}
.chk .q{font-size:15px;color:#92400e;font-weight:700}
.chk .t{font-size:19px;margin:2px 0 6px}
.chk .acts{display:flex;gap:6px;flex-wrap:wrap}
.chk .acts button{background:#fff;border-radius:10px;padding:7px 10px;font-size:15px;font-weight:700;border:2px solid #f4d9a4}
.chk .acts .ok{background:#dff3e6;border-color:#bfe5cb}
.item .when{font-size:13px;color:#2f8f82;font-weight:700;display:block}
.ev.task.check{outline:3px dashed #f59e0b;outline-offset:-3px}
.ev.done-ev{opacity:.6;text-decoration:line-through}
.cc .sub2{font-size:13px;font-weight:700;opacity:.9;position:relative;z-index:2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc .bar2{height:6px;border-radius:99px;background:rgba(255,255,255,.6);margin-top:4px;position:relative;z-index:2;overflow:hidden}
.cc .bar2 i{display:block;height:100%;background:#2b2f3a;border-radius:99px}
.homecard{background:#c3e8cc}
.ghost{position:fixed;z-index:60;pointer-events:none;background:#fff;border-radius:14px;padding:10px 16px;font-size:20px;box-shadow:0 12px 30px rgba(0,0,0,.2);transform:translate(-30px,-60%) rotate(-2deg)}
/* shop chooser */
.chooser{position:absolute;inset:0;background:rgba(255,255,255,.97);z-index:5;padding:18px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.chooser h3{margin:0;font-size:22px}
.chooser .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chooser .opt{text-align:left;display:flex;align-items:center;gap:10px}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(43,47,58,.35);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--card);border-radius:26px;width:min(920px,100%);max-height:94vh;overflow:auto;padding:22px 28px}
.modal h2{margin:0 0 4px;font-size:30px}
.step{font-size:17px;color:var(--muted);margin:16px 0 8px;font-weight:700}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{border:3px solid var(--line);border-radius:16px;padding:12px 18px;font-size:21px;background:#fff;min-width:96px}
.opt.on{border-color:var(--ink);background:var(--soft);font-weight:700}
.opt .dot{vertical-align:-4px;margin-right:8px}
.opt .tick{display:inline-block;width:22px;font-weight:800}
.txt{width:100%;border:3px solid var(--line);border-radius:16px;padding:14px;font-size:25px;user-select:text;-webkit-user-select:text}
.mact{display:flex;gap:12px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.mact button{border-radius:16px;padding:15px 26px;font-size:21px;font-weight:800}
.save{background:var(--accent)}
.cancel{background:var(--soft)}
.del{background:#fde7e4;color:var(--danger);margin-right:auto}
.note{font-size:16px;color:var(--muted);line-height:1.45}
/* time wheels */
.timewrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.wheels{position:relative;display:flex;align-items:center;gap:4px;background:var(--soft);border-radius:22px;padding:6px 14px}
.wheels:before{content:"";position:absolute;left:10px;right:10px;top:50%;height:64px;margin-top:-32px;border-radius:16px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.wheel{position:relative;height:192px;width:96px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent);mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent);touch-action:pan-y}
.wheel::-webkit-scrollbar{display:none}
.wheel .pad{height:64px}
.wi{height:64px;scroll-snap-align:center;display:grid;place-items:center;font-size:28px;color:#a8a29a;font-variant-numeric:tabular-nums;cursor:pointer}
.wi.sel{font-size:42px;color:var(--ink);font-weight:800}
.wheel.ampm{width:82px}
.wheel.ampm .wi{font-size:22px}.wheel.ampm .wi.sel{font-size:28px}
.colon{position:relative;font-size:40px;font-weight:800}
.typed{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tdial{display:flex;align-items:center;gap:12px;margin:4px 0}
.tdl{width:78px;font-size:17px;font-weight:800;color:var(--muted)}
.tdial .wheel{height:150px}.tdial .wheel .pad,.tdial .wi{height:50px}.tdial .wheels:before{height:50px;margin-top:-25px}
.tdial .wi{font-size:24px}.tdial .wi.sel{font-size:34px}
.tdial .typed input{width:74px;height:58px;font-size:32px}
.tlen{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 0 90px;font-size:18px}
.tquick{display:flex;gap:6px;flex-wrap:wrap}
.opt.sm{padding:6px 12px;font-size:15px;min-height:0}
.addrrow{position:relative}
.addrlist{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--card);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:20;overflow:hidden;max-height:300px;overflow-y:auto}
.addropt{display:block;width:100%;text-align:left;padding:12px 14px;font-size:17px;border-bottom:1px solid var(--line)}
.addropt:hover{background:var(--soft)}
.addrsrc{font-size:11px;color:var(--muted);padding:4px 10px;text-align:right}
.nzwarn{background:#fff3cf;border-radius:12px;padding:8px 12px;font-size:15px;font-weight:700;margin-bottom:6px}
.typed input{width:96px;height:72px;font-size:40px;font-weight:800;text-align:center;border:3px solid var(--line);border-radius:16px;user-select:text;-webkit-user-select:text}
.linkbtn{background:var(--soft);border-radius:14px;padding:10px 16px;font-size:18px}
/* settings */
.prow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.prow input[type=text],.prow input[type=url]{border:2px solid var(--line);border-radius:12px;padding:10px;font-size:18px;width:210px;user-select:text;-webkit-user-select:text}

/* ===== Family Screen always runs on Auckland time, whatever time zone this phone is set to =====
   On a phone set to another zone (e.g. Reyna in Los Angeles) the local clock functions are made to read
   Auckland time, so the calendar, the now-line and new entries are all NZ time. NZ devices are untouched. */
const HOME_TZ='Pacific/Auckland';
const DEVICE_TZ=(()=>{ try{ return Intl.DateTimeFormat().resolvedOptions().timeZone||''; }catch(e){ return ''; } })();
const AWAY_TZ=!!DEVICE_TZ&&DEVICE_TZ!==HOME_TZ&&DEVICE_TZ!=='NZ'&&!/^Antarctica\/(McMurdo|South_Pole)$/.test(DEVICE_TZ);
(function(){
  if(!AWAY_TZ) return;
  const RD=Date; window.DeviceDate=RD; const P=RD.prototype, RDTF=Intl.DateTimeFormat, getT=P.getTime, setT=P.setTime;
  const raw={ld:P.toLocaleDateString, lt:P.toLocaleTimeString, ls:P.toLocaleString};
  const fmt=new RDTF('en-US',{timeZone:HOME_TZ,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'});
  const cache=new Map();
  function off(t){ const k=Math.floor(t/9e5); let o=cache.get(k); if(o!==undefined) return o; const t0=k*9e5, p={};
    for(const x of fmt.formatToParts(new RD(t0))) p[x.type]=x.value;
    o=RD.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute,+p.second)-t0; cache.set(k,o); return o; }
  function fromWall(y,mo,d,h,mi,s,ms){ const g=RD.UTC(y,mo,d,h,mi,s,ms); let t=g-off(g); t=g-off(t); return t; }
  const W=d=>{ const t=getT.call(d); return new RD(t+off(t)); };
  const G={getFullYear:'getUTCFullYear',getMonth:'getUTCMonth',getDate:'getUTCDate',getDay:'getUTCDay',getHours:'getUTCHours',getMinutes:'getUTCMinutes',getSeconds:'getUTCSeconds',getMilliseconds:'getUTCMilliseconds'};
  for(const [k,u] of Object.entries(G)) P[k]=function(){ return isNaN(getT.call(this))?NaN:W(this)[u](); };
  P.getTimezoneOffset=function(){ return -off(getT.call(this))/6e4; };
  const S={setFullYear:0,setMonth:1,setDate:2,setHours:3,setMinutes:4,setSeconds:5,setMilliseconds:6};
  for(const [k,i] of Object.entries(S)) P[k]=function(...a){ const w=W(this), c=[w.getUTCFullYear(),w.getUTCMonth(),w.getUTCDate(),w.getUTCHours(),w.getUTCMinutes(),w.getUTCSeconds(),w.getUTCMilliseconds()];
    a.forEach((v,j)=>{ if(i+j<7) c[i+j]=+v; }); return setT.call(this,fromWall(...c)); };
  P.toLocaleDateString=function(l,o){ return raw.ld.call(this,l,Object.assign({timeZone:HOME_TZ},o)); };
  P.toLocaleTimeString=function(l,o){ return raw.lt.call(this,l,Object.assign({timeZone:HOME_TZ},o)); };
  P.toLocaleString=function(l,o){ return raw.ls.call(this,l,Object.assign({timeZone:HOME_TZ},o)); };
  function DTF(l,o){ return new RDTF(l,Object.assign({timeZone:HOME_TZ},o)); }
  DTF.prototype=RDTF.prototype; DTF.supportedLocalesOf=RDTF.supportedLocalesOf.bind(RDTF); Intl.DateTimeFormat=DTF;
  const LOCAL=/^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)(?::(\d\d)(?:\.(\d{1,3})\d*)?)?$/;
  const pl=v=>{ const m=typeof v==='string'&&LOCAL.exec(v); return m?fromWall(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0),+((m[7]||'0').padEnd(3,'0'))):null; };
  class HD extends RD{ constructor(...a){
    if(!a.length) super(); else if(a.length===1){ const v=a[0], t=pl(v); super(t!=null?t:(v instanceof RD?getT.call(v):v)); }
    else super(fromWall(+a[0],+a[1],a[2]==null?1:+a[2],+(a[3]||0),+(a[4]||0),+(a[5]||0),+(a[6]||0))); } }
  HD.parse=v=>{ const t=pl(v); return t!=null?t:RD.parse(v); };
  window.Date=HD;
})();

const isCx=l=>!!(l&&/Canceled/.test(l.status||''));
function fS(f){ const l=liveOf(f); return new Date(l&&l.dep&&!isCx(l)?l.dep:f.start); }

function liveTag(f){
  const l=liveOf(f); if(!l||!l.status||l.status==='NoData') return '';

  if(l.on||/Arrived|Landed/.test(l.status)) return '🛬 Landed'+(late?' · '+late.slice(2):'');
  if(l.off||/EnRoute|Departed|Approaching/.test(l.status)) return '🛫 In the air'+(late?' · '+late.slice(2):'');
  return late||'✅ On time';
}
const liveCls=f=>{ const t=liveTag(f); return /Cancelled|Diverted|late/.test(t)?'lv-bad':t?'lv-ok':''; };
const liveBadge=f=>{ let t=liveTag(f); if(!t) return ''; if(/late|early/.test(t)) t=t.replace(/^.*· /,'').replace(/^(?![⏰⏩])/,'⏰ '); return `<span class="lv ${liveCls(f)}" style="white-space:normal;margin-top:3px">${t}</span>`; };
// the flight that brings this person home, if it's been cancelled
function homeCancelled(tp,now){ const f=S.flights.filter(f=>f.who===tp.id&&HOME.includes(f.to)&&fE(f)>now).sort((a,b)=>fS(a)-fS(b))[0]; return f&&isCx(liveOf(f))?f:null; }
function travellerNow(now){
  const tp=traveller(); if(!tp) return null;
  if(S.override){ if(S.override.code==='HOME') return null; const a=AIRPORTS[S.override.code]; return a?{tp,code:S.override.code,a,manual:true}:null; }
  const fl=S.flights.filter(f=>f.who===tp.id).sort((a,b)=>fS(a)-fS(b));
  let loc=null, inAir=null, last=null;
  for(const f of fl){ const s=fS(f), e=fE(f); if(s<=now&&now<e){ inAir=f; break; } if(e<=now){ loc=f.to; last=f; } }
  const next=fl.find(f=>fS(f)>now);
  if(inAir){ return {tp,air:inAir,code:inAir.to,a:AIRPORTS[inAir.to]||null,from:AIRPORTS[inAir.from]||null,next}; }
  if(!loc||HOME.includes(loc)) return null;

}

/* ================= clocks ================= */

const tName=tp=>tp?(tp.nick||tp.name):'';

function taxiOf(f){

function relTime(d,now){

}
const etaTxt=d=>`${fmtD(d,{weekday:'short'})} ${fmtTime(d,'Pacific/Auckland')}`;
function clockHTML(tz,city,sub,extra,badge){
  const now=new Date(), t=hm(now,tz), o=orbStyle(t.h,t.m);

function flightProgress(f,now){ return Math.min(1,Math.max(0,(now-fS(f))/(fE(f)-fS(f)))); }

function whenShort(d,now){ const k=dk(d); return (k===dk(now)?'today':k===dk(addDays(now,1))?'tomorrow':fmtD(d,{weekday:'short'}))+' '+fmtTime(d,HOME_TZ); }

  const b=AIRPORTS[f.to], d=fS(f), tx=taxiOf(f), taxi=tx&&tx.pick&&tx.pick>now?`🚕 Taxi ${fmtTime(tx.pick,'Pacific/Auckland')}`:'';

// rpt: {f:'D'|'W'|'M'|'Y', n:interval, days:[0-6 Sun..Sat] (weekly), until:'YYYY-MM-DD'|'' , ex:['YYYY-MM-DD',...]}
const DAYMS=864e5;
const kd=k=>new Date(k+'T12:00');
function occursOn(e,key){
  if(!e.rpt) return e.date===key;
  const r=e.rpt; if(key<e.date) return false; if(r.until&&key>r.until) return false; if(r.ex&&r.ex.includes(key)) return false;
  const a=kd(e.date), b=kd(key), n=Math.max(1,r.n||1);

  if(r.f==='M'){ if(b.getDate()!==a.getDate()) return false; return ((b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth())%n===0; }
  if(r.f==='Y') return b.getDate()===a.getDate()&&b.getMonth()===a.getMonth()&&(b.getFullYear()-a.getFullYear())%n===0;
  return e.date===key;
}

function rptText(r){
  if(!r) return '';
  const n=r.n||1;
  let t=r.f==='D'?(n===1?'Every day':`Every ${n} days`):r.f==='W'?(n===1?'Every week':n===2?'Every fortnight':`Every ${n} weeks`)+(r.days&&r.days.length?' on '+[1,2,3,4,5,6,0].filter(d=>r.days.includes(d)).map(d=>WD[d]).join(', '):''):
    r.f==='M'?(n===1?'Every month':`Every ${n} months`):r.f==='Y'?'Every year':'';

}

const HOUR=58;
function dayBlocks(key){

  const mins=d=>Math.round((d-dayStart)/6e4);
  for(const it of its){
    if(it.k==='ev'){ const e=it.e, names=e.whos.map(nm).filter(Boolean).join(' + '), tk=(e.priv?LOCK:'')+(e.todoId?(e.done?'✅ ':'☐ '):'');
      if(!e.time){ all.push({bg:evBg(e.whos),title:tk+e.title,sub:[e.rpt?'🔁':'',names].filter(Boolean).join(' '),addr:e.addr,attr:`data-ev="${e.id}" data-occ="${key}"`}); continue; }
      const [h,m]=e.time.split(':').map(Number), s=h*60+m;
      timed.push({s,e:Math.min(1440,s+(e.dur||60)),bg:evBg(e.whos),title:tk+e.title,sub:[tRange(e)+(AWAY_TZ&&e.time?' NZ':'')+evHere(e,key),names].filter(Boolean).join(' · '),addr:e.addr,done:e.done,attr:`data-ev="${e.id}" data-occ="${key}"`}); }
    else if(it.k==='away'){ const a=it.w.code?AIRPORTS[it.w.code]:null; all.push({bg:`repeating-linear-gradient(135deg,${col(it.who)} 0 10px,#fff8 10px 20px)`,title:a?`💼 ${tName(person(it.who))} in ${a[0]} ${a[3]}`:'✈️ Flying',sub:'All day',attr:'data-where="1"'}); }
    else if(it.k==='taxi'){ const f=it.f, a0=it.kind==='pick'?it.t:it.t2, b0=it.kind==='pick'?it.t2:it.t, c=col(f.who);
      const s=Math.max(0,mins(a0)), e=Math.min(1440,mins(b0));
      timed.push({s,e:Math.max(e,s+30),bg:`repeating-linear-gradient(135deg,${c} 0 9px,#ffffffb0 9px 18px)`,title:taxiLbl(it),sub:tName(person(f.who))+' · '+taxiSub(it),attr:`data-fl="${f.id}"`}); }
    else { const f=it.f, s0=fS(f), e0=fE(f), a=AIRPORTS[f.from], b=AIRPORTS[f.to];
      if(it.k==='arr'&&dk(s0)===key) continue;
      const s=Math.max(0,mins(s0)), e=Math.min(1440,mins(e0));
      const title=`✈️ ${f.flight||''} ${a?a[0]:f.from} → ${b?b[0]:f.to}${liveTag(f)?' · '+liveTag(f):''}`;
      const sub=it.k==='arr'?`🛬 lands ${fmtTime(e0,'Pacific/Auckland')} NZ${alsoHere(e0)}`:`${fmtTime(s0,'Pacific/Auckland')}–${dk(e0)===key?fmtTime(e0,'Pacific/Auckland'):'next day '+fmtTime(e0,'Pacific/Auckland')}${f.report?' · signs on '+fmtTime(new Date(f.report),'Pacific/Auckland'):''}`;
      timed.push({s,e:Math.max(e,s+30),bg:col(f.who),title,sub:tName(person(f.who))+' · '+sub,attr:`data-fl="${f.id}"`,flight:true}); }
  }
  // side-by-side columns for entries that overlap
  timed.sort((a,b)=>a.s-b.s||b.e-a.e);
  let cluster=[], end=-1;
  const flush=()=>{ const cols=[]; for(const t of cluster){ let c=cols.findIndex(x=>x<=t.s); if(c<0){ c=cols.length; cols.push(0); } cols[c]=t.e; t.col=c; } cluster.forEach(t=>t.cols=cols.length); cluster=[]; };
  for(const t of timed){ if(t.s>=end&&cluster.length){ flush(); end=-1; } cluster.push(t); end=Math.max(end,Math.max(t.e,t.s+30)); }

}

/* ================= press-and-drag (touch: press & hold; mouse: just drag) ================= */
let drag=null, suppressClick=false;
window.addEventListener('click',e=>{ const nv=e.target.closest&&e.target.closest('[data-nav]'); if(nv&&!suppressClick){ e.stopPropagation(); e.preventDefault(); window.open(navUrl(nv.dataset.nav),'_blank','noopener'); return; } if(suppressClick){ e.stopPropagation(); e.preventDefault(); suppressClick=false; } },true);
document.addEventListener('touchmove',e=>{ if(drag&&drag.live) e.preventDefault(); },{passive:false});
document.addEventListener('contextmenu',e=>{ if(e.target.closest('[data-lift]')) e.preventDefault(); });
function liftable(el,opts){
  el.addEventListener('pointerdown',e=>{
    if(e.button>0||e.target.closest('[data-nolift]')) return;
    const st={el,opts,sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY,live:false,timer:null,pid:e.pointerId,mouse:e.pointerType==='mouse'};
    drag=st;
    if(!st.mouse) st.timer=setTimeout(()=>{ if(drag===st) goLive(st); },320);
    window.addEventListener('pointermove',onMove); window.addEventListener('pointerup',onUp); window.addEventListener('pointercancel',onCancel);
  });
}
function goLive(st){
  st.live=true; document.body.classList.add('dragging'); st.el.classList.add('lifted');
  const g=document.createElement('div'); g.className='ghost'; g.textContent=st.opts.label(); document.body.appendChild(g); st.g=g;
  try{ navigator.vibrate&&navigator.vibrate(15); }catch(e){}
  if(st.opts.onLive) st.opts.onLive();
  place(st);
}
function place(st){
  st.g.style.left=st.x+'px'; st.g.style.top=st.y+'px';
  const el=document.elementFromPoint(st.x,st.y), tgt=el&&el.closest(st.opts.targets);
  if(tgt!==st.over){ if(st.over) st.over.classList.remove('drop-on'); st.over=tgt; if(tgt) tgt.classList.add('drop-on'); }
}
function onMove(e){
  const st=drag; if(!st||e.pointerId!==st.pid) return; st.x=e.clientX; st.y=e.clientY;
  const moved=Math.hypot(st.x-st.sx,st.y-st.sy);
  if(!st.live){ if(st.mouse&&moved>6) goLive(st); else if(!st.mouse&&moved>10){ endDrag(); } return; }
  place(st);
}
function onUp(){ const st=drag; if(!st) return; const over=st.over, live=st.live; endDrag(); if(pendingRender){ pendingRender=false; setTimeout(renderAll,450); } if(live){ suppressClick=true; setTimeout(()=>suppressClick=false,400); if(over) st.opts.drop(over); } }
function onCancel(){ endDrag(); }
function endDrag(){
  const st=drag; if(!st) return; clearTimeout(st.timer);
  window.removeEventListener('pointermove',onMove); window.removeEventListener('pointerup',onUp); window.removeEventListener('pointercancel',onCancel);
  if(st.g) st.g.remove(); if(st.over) st.over.classList.remove('drop-on'); if(st.live&&st.opts.onEnd) st.opts.onEnd(); st.el.classList.remove('lifted'); document.body.classList.remove('dragging'); drag=null;
}

/* ================= shopping ================= */
let pending=null; // item waiting for a shop choice
function suggestShop(name){
  const k=name.toLowerCase(); if(S.itemShop[k]&&S.shops.some(s=>s.id===S.itemShop[k])) return S.itemShop[k];
  if(S.shopTab!=='all'&&S.shops.some(s=>s.id===S.shopTab)) return S.shopTab;
  for(const s of S.shops){ const w=SHOP_WORDS[s.kind]; if(w&&w.split(' ').some(x=>k.includes(x))) return s.id; }
  return (S.shops.find(s=>s.aisles)||S.shops[0]).id;
}
function addToShop(name,sid){
  const ex=S.groceries.find(x=>x.shop===sid&&x.name.toLowerCase()===name.toLowerCase());
  if(ex){ ex.done=false; toast(`${ex.name} is already on the ${shop(sid).name} list`); }
  else S.groceries.push({id:uid(),name:name.charAt(0).toUpperCase()+name.slice(1),shop:sid,aisle:shop(sid).aisles?guessAisle(name):'',done:false});
  S.itemShop[name.toLowerCase()]=sid; save();
}
function moveItem(id,sid){
  const g=S.groceries.find(x=>x.id===id); if(!g||g.shop===sid) return;
  g.shop=sid; g.aisle=shop(sid).aisles?(g.aisle||guessAisle(g.name)):''; S.itemShop[g.name.toLowerCase()]=sid; save(); renderShop(); toast(`Moved to ${shop(sid).name}`);

// A scrolling dial. With loop, the values repeat so you can roll straight from 12 to 1 or 59 to 00.
// Tapping the number in the middle calls onTapSel (used to switch to typing).
function makeWheel(values,idx,onPick,cls,opt){
  opt=opt||{}; const L=values.length, loop=!!opt.loop, C=loop?9:1, mid=loop?4*L:0;
  const w=document.createElement('div'); w.className='wheel'+(cls?' '+cls:''); const hh=()=>{ const el=w.querySelector('.wi'); return (el&&el.getBoundingClientRect().height)||64; };
  let items=''; for(let c=0;c<C;c++) values.forEach((v,i)=>items+=`<div class="wi" data-r="${c*L+i}">${v}</div>`);
  w.innerHTML='<div class="pad"></div>'+items+'<div class="pad"></div>';
  const all=()=>w.querySelectorAll('.wi');
  let raw=mid+idx, t, t2;
  const mark=r=>{ const els=all(); els.forEach(el=>el.classList.remove('sel')); if(els[r]) els[r].classList.add('sel'); };
  w.addEventListener('scroll',()=>{ const r=Math.max(0,Math.min(C*L-1,Math.round(w.scrollTop/hh()))); if(r!==raw){ raw=r; mark(r); }
    clearTimeout(t); t=setTimeout(()=>onPick(raw%L),80);
    clearTimeout(t2); if(loop) t2=setTimeout(()=>{ if(raw<2*L||raw>=7*L){ const i=raw%L; raw=mid+i; w.scrollTop=raw*hh(); mark(raw); } },260); });
  w.addEventListener('click',e=>{ const el=e.target.closest('.wi'); if(!el) return; const r=+el.dataset.r;
    if(r===raw&&opt.onTapSel){ opt.onTapSel(); return; } w.scrollTo({top:r*hh(),behavior:'smooth'}); });
  w.setTo=i=>{ raw=mid+i; w.scrollTop=raw*hh(); mark(raw); };
  requestAnimationFrame(()=>w.setTo(idx));
  return w;
}

        el.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>{ read(); H=(H%12)+(b.dataset.ap==='pm'?12:0); put(); el.querySelectorAll('[data-ap]').forEach(x=>x.classList.toggle('on',x===b)); });
        el.querySelector('.okt').onclick=()=>{ read(); st.typing=false; draw(); };
        mm.onkeydown=hh.onkeydown=e=>{ if(e.key==='Enter'){ read(); st.typing=false; draw(); } };
        setTimeout(()=>hh.focus(),50); return null;
      }
      const wh=document.createElement('div'); wh.className='wheels'; el.appendChild(wh);
      const type=()=>{ st.typing=which; draw(); };
      const hours=Array.from({length:12},(_,i)=>String(i+1)), mins=Array.from({length:60},(_,i)=>String(i).padStart(2,'0'));
      const hw=makeWheel(hours,((H%12)||12)-1,i=>{ H=((i+1)%12)+(H>=12?12:0); put(); },'',{loop:true,onTapSel:type});
      const c=document.createElement('span'); c.className='colon'; c.textContent=':';
      const mw=makeWheel(mins,M,i=>{ M=i; put(); },'',{loop:true,onTapSel:type});
      const aw=makeWheel(['am','pm'],H>=12?1:0,i=>{ H=(H%12)+(i?12:0); put(); },'ampm',{onTapSel:type});
      wh.append(hw,c,mw,aw);
      return {set:hm=>{ [H,M]=hm.split(':').map(Number); hw.setTo(((H%12)||12)-1); mw.setTo(M); aw.setTo(H>=12?1:0); }};
    };
    let endDial=null;
    dial(area.querySelector('#d0'),()=>st.time,v=>{ st.time=v; if(endDial) endDial.set(endHM()); refresh(); },'start');    // moving the start keeps the length
    endDial=dial(area.querySelector('#d1'),endHM,v=>{ let d=toMin(v)-toMin(st.time); if(d<=0) d+=1440; st.dur=d; refresh(); },'end');
    area.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{ st.dur=+b.dataset.q; if(endDial) endDial.set(endHM()); else draw(); refresh(); });
  };
  draw();
}

// Address suggestions as you type (OpenStreetMap search via Photon; leans towards Auckland). Free, no key.
function addrSearch(input,list,onSet){
  let t=null, seq=0;
  const label=p=>{ const a=[p.housenumber&&p.street?p.housenumber+' '+p.street:(p.street||''), p.name&&p.name!==p.street?p.name:'', p.district||p.locality||'', p.city||p.county||''];
    const out=[]; for(const x of a) if(x&&!out.includes(x)) out.push(x); if(p.name&&p.name!==p.street&&out[0]!==p.name){ out.splice(out.indexOf(p.name),1); out.unshift(p.name); } return out.join(', '); };
  const hide=()=>{ list.hidden=true; list.innerHTML=''; };
  input.addEventListener('input',()=>{ onSet(input.value); clearTimeout(t); const q=input.value.trim(); if(q.length<3){ hide(); return; }
    t=setTimeout(async()=>{ const my=++seq;
      try{ const r=await fetch('https://photon.komoot.io/api/?limit=6&lang=en&lat=-36.85&lon=174.76&q='+encodeURIComponent(q)); if(!r.ok) return; const j=await r.json(); if(my!==seq) return;
        const seen=new Set(), items=(j.features||[]).map(f=>label(f.properties||{})).filter(x=>x&&!seen.has(x)&&seen.add(x));
        if(!items.length){ hide(); return; }
        list.innerHTML=items.map(x=>`<button type="button" class="addropt">📍 ${esc(x)}</button>`).join('')+'<div class="addrsrc">© OpenStreetMap</div>'; list.hidden=false;
        list.querySelectorAll('.addropt').forEach((b,i)=>b.onclick=()=>{ input.value=items[i]; onSet(items[i]); hide(); });
      }catch(e){ hide(); } },350); });
  input.addEventListener('keydown',e=>{ if(e.key==='Escape') hide(); });
  input.addEventListener('blur',()=>setTimeout(hide,250));
}

/* ================= globe: where is everyone? ================= */
let globeTimer=null;
// Satellite pictures of the Earth (NASA Blue Marble by day, Black Marble city lights by night), loaded once and kept.
let EARTH=null;
function earthTex(){
  if(EARTH) return EARTH;
  const load=src=>new Promise((ok,no)=>{ const im=new Image(); im.onload=()=>{ const c=document.createElement('canvas'); c.width=im.naturalWidth; c.height=im.naturalHeight;
    const x=c.getContext('2d',{willReadFrequently:true}); x.drawImage(im,0,0); ok({w:c.width,h:c.height,d:x.getImageData(0,0,c.width,c.height).data}); }; im.onerror=no; im.src=src; });
  EARTH=Promise.all([load('earth-day.jpg'),load('earth-night.jpg')]).then(([day,night])=>({day,night})).catch(e=>{ EARTH=null; throw e; });
  return EARTH;
}
// Paint the globe pixel by pixel: daylight side from the day picture, night side dark with city lights, a soft dusk band between.
function paintEarth(cv,proj,tex,sun,scale){
  const W=cv.width, H=cv.height, ctx=cv.getContext('2d'), img=ctx.createImageData(W,H), o=img.data;
  const k=proj.scale()*scale, t=proj.translate(), cx=t[0]*scale, cy=t[1]*scale, R=d3.geoRotation(proj.rotate());
  const cart=ll=>{ const l=ll[0]*Math.PI/180, f=ll[1]*Math.PI/180; return [Math.cos(f)*Math.cos(l),Math.cos(f)*Math.sin(l),Math.sin(f)]; };
  // columns of the matrix taking the viewer's frame back to real-world positions
  const ex=cart(R.invert([0,0])), ey=cart(R.invert([90,0])), ez=cart(R.invert([0,90])), sv=cart(sun);
  const D=tex.day, N=tex.night, dw=D.w, dh=D.h, nw=N.w, nh=N.h, dd=D.d, nd=N.d, PI=Math.PI;
  const x0=Math.max(0,Math.floor(cx-k)), x1=Math.min(W,Math.ceil(cx+k)), y0=Math.max(0,Math.floor(cy-k)), y1=Math.min(H,Math.ceil(cy+k));
  for(let py=y0;py<y1;py++){ const v=(cy-py-.5)/k;
    for(let px=x0;px<x1;px++){ const u=(px+.5-cx)/k, r2=u*u+v*v; if(r2>1) continue;
      const z=Math.sqrt(1-r2);                     // (z toward the viewer, u east, v north) in the viewer's frame
      const X=ex[0]*z+ey[0]*u+ez[0]*v, Y=ex[1]*z+ey[1]*u+ez[1]*v, Z=ex[2]*z+ey[2]*u+ez[2]*v;
      const lon=Math.atan2(Y,X), lat=Math.asin(Z<-1?-1:Z>1?1:Z);
      const tu=(lon+PI)/(2*PI), tv=(PI/2-lat)/PI;
      const di=((Math.min(dh-1,tv*dh|0))*dw+Math.min(dw-1,tu*dw|0))*4, ni=((Math.min(nh-1,tv*nh|0))*nw+Math.min(nw-1,tu*nw|0))*4;
      const c=X*sv[0]+Y*sv[1]+Z*sv[2];             // sun height: >0 day, <0 night
      let w=(c+.1)/.2; w=w<0?0:w>1?1:w*w*(3-2*w);
      const lit=.82+.18*Math.max(0,c), edge=.78+.22*z;  // gentle shading toward the edge
      const nl=1-w, i=(py*W+px)*4;
      o[i]=(dd[di]*(w*lit+nl*.13)+nd[ni]*nl*1.05)*edge; o[i+1]=(dd[di+1]*(w*lit+nl*.13)+nd[ni+1]*nl*.95)*edge; o[i+2]=(dd[di+2]*(w*lit+nl*.16)+nd[ni+2]*nl*.7)*edge; o[i+3]=255;
    } }
  ctx.putImageData(img,0,0);
}
function subsolar(d){
  const start=Date.UTC(d.getUTCFullYear(),0,0), doy=(d.getTime()-start)/864e5;
  const g=2*Math.PI/365*(doy-1);
  const eqt=229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
  const decl=0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
  const mins=d.getUTCHours()*60+d.getUTCMinutes()+d.getUTCSeconds()/60;
  return [-(mins+eqt-720)/4, decl*180/Math.PI];
}
function closeGlobe(){ cancelAnimationFrame(globeTimer); $('#spaceLayer').innerHTML=''; }
// Where the plane probably is now: start from the last radar fix and carry on towards the destination
// at the average speed it was making (between the last two fixes, else since take-off).
function deadReckon(f,from,to,now){
  const l=liveOf(f), p=l&&l.pos; if(!p||!p.at||l.on||now-p.at>10*36e5) return null;

function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0).toString(36); }
function parseICS(text,who,isRoster,sid){
  sid=sid||uid();
  const lines=text.replace(/\r?\n[ \t]/g,'').split(/\r?\n/); const evs=[]; let cur=null;
  for(const ln of lines){
    if(ln==='BEGIN:VEVENT') cur={}; else if(ln==='END:VEVENT'){ if(cur) evs.push(cur); cur=null; }
    else if(cur){ const i=ln.indexOf(':'); if(i<0) continue; const k=ln.slice(0,i), name=k.split(';')[0];
      if(name==='EXDATE'){ (cur.EXDATES=cur.EXDATES||[]).push({v:ln.slice(i+1),params:k}); } else cur[name]={v:ln.slice(i+1),params:k}; }
  }

    if(m[7]) return new Date(Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0)));
    const tz=(o.params.match(/TZID=([^;:]+)/)||[])[1];
    if(tz){ try{ const g=new Date(Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5])); return new Date(g.getTime()-offsetMin(tz,g)*6e4); }catch(e){} }
    return new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5]); };

  const BYDAY={SU:0,MO:1,TU:2,WE:3,TH:4,FR:5,SA:6};
  function rrule(e,start){
    if(!e.RRULE) return null;
    const p=Object.fromEntries(e.RRULE.v.split(';').map(x=>x.split('=')));
    const f={DAILY:'D',WEEKLY:'W',MONTHLY:'M',YEARLY:'Y'}[p.FREQ]; if(!f) return null;
    const r={f,n:+(p.INTERVAL||1),until:'',ex:[]};
    if(f==='W') r.days=p.BYDAY?p.BYDAY.split(',').map(x=>BYDAY[x.slice(-2)]).filter(x=>x!==undefined):[start.getDay()];
    if(f==='M'&&p.BYDAY) return 'unsupported';           // e.g. "2nd Tuesday" — not handled yet
    if(p.UNTIL){ const u=toDate({v:p.UNTIL,params:''}); if(u) r.until=dk(u); }
    (e.EXDATES||[]).forEach(x=>x.v.split(',').forEach(v=>{ const d=toDate({v,params:x.params}); if(d) r.ex.push(dk(d)); }));
    if(p.COUNT){ // turn "10 times" into an end date

    }

    else if(k<lo||k>hi) continue;

    if(m&&(AIRPORTS[m[1]]||AIRPORTS[m[2]])){ flights.push({id,who,src:sid,flight:((sum.match(/\b(NZ\s?\d{1,4})\b/)||[])[1]||'').replace(' ',''),from:m[1],to:m[2],start:s.toISOString(),end:en.toISOString()}); continue; }
    if(!sum) continue;
    const loc=(e.LOCATION?.v||'').replace(/\\,/g,',').replace(/\\n/g,' ').replace(/\\;/g,';').trim();

}
// put a parsed calendar into the family data, replacing whatever that source brought in before
function applySource(src,parsed){
  S.events=S.events.filter(x=>x.src!==src.id).concat(parsed.others);
  if(src.type==='roster'){ S.flights=S.flights.filter(x=>!(x.who===src.who)).concat(parsed.flights); S.override=null; }
  else S.flights=S.flights.filter(x=>x.src!==src.id).concat(parsed.flights);
  src.count=parsed.flights.length+parsed.others.length; src.at=Date.now();
}

async function fetchLink(src){

async function pdfLines(file){
  const pdfjs=await import(new URL('lib/pdf.min.mjs',location.href).href);
  pdfjs.GlobalWorkerOptions.workerSrc=new URL('lib/pdf.worker.min.mjs',location.href).href;
  const doc=await pdfjs.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const lines=[];
  for(let p=1;p<=doc.numPages;p++){ const pg=await doc.getPage(p); const tc=await pg.getTextContent(); const rows={};
    tc.items.filter(i=>i.str).forEach(i=>{ const y=Math.round(i.transform[5]); (rows[y]=rows[y]||[]).push(i); });
    Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y=>lines.push(rows[y].sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str).join(''))); }
  return lines;
}

/* ================= Settings PIN (keeps little fingers out of the settings) ================= */
let pinUntil=0, pinFails=0, pinWaitUntil=0;
async function pinHashOf(pin){ const salt=(LOCAL?'demo':(SYNC.householdId()||''))+'|family-screen|'; const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+pin)); return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join(''); }
const pinTrusted=()=>!!lsGet('fs.pinTrust',false);
function requirePin(fn){
  if(!S.pinHash||pinTrusted()||Date.now()<pinUntil){ fn(); return; }
  pinPad('Enter the Settings PIN',async pin=>{ if(await pinHashOf(pin)===S.pinHash){ pinUntil=Date.now()+5*60e3; pinFails=0; return true; } pinFails++; if(pinFails>=3){ pinWaitUntil=Date.now()+30e3; pinFails=0; } return false; },fn,true);
}
function pinPad(title,check,onOk,canForget){
  modal((m,close)=>{ let val='';
    const draw=()=>{
      const wait=Math.max(0,Math.ceil((pinWaitUntil-Date.now())/1000));
      m.classList.add('pinmodal');
      m.innerHTML=`<h2 style="text-align:center">🔒 ${esc(title)}</h2>
        <div class="pindots">${[0,1,2,3].map(i=>`<i class="${i<val.length?'on':''}"></i>`).join('')}</div>
        <p class="note" id="pinMsg" style="text-align:center;min-height:22px">${wait?`Too many tries. Wait ${wait} seconds.`:''}</p>
        <div class="pinpad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<button data-k="x" class="pk-s">Cancel</button><button data-k="0">0</button><button data-k="b" class="pk-s">⌫</button></div>
        ${canForget?'<p style="text-align:center;margin:10px 0 0"><button class="linkbtn" id="pinForgot">Forgot the PIN?</button></p>':''}`;
      m.querySelectorAll('[data-k]').forEach(b=>b.onclick=async()=>{
        const k=b.dataset.k;
        if(k==='x'){ close(); return; }
        if(Date.now()<pinWaitUntil){ draw(); return; }
        if(k==='b'){ val=val.slice(0,-1); draw(); return; }
        if(val.length<4) val+=k; draw();
        if(val.length===4){ const ok=await check(val); if(ok){ close(); onOk&&onOk(val); } else { val=''; draw(); const msg=m.querySelector('#pinMsg'); if(msg&&!msg.textContent) msg.textContent='That PIN isn’t right'; m.querySelector('.pindots').classList.add('shake'); } }
      });
      const f=m.querySelector('#pinForgot'); if(f) f.onclick=async()=>{
        if(LOCAL){ S.pinHash=''; save(); close(); toast('PIN removed'); onOk&&onOk(); return; }
        try{ await SYNC.reauth(); S.pinHash=''; save(); close(); toast('PIN removed. Set a new one in ⚙️ Settings.'); onOk&&onOk(); }
        catch(e){ toast('Only a family member’s Google sign-in can reset the PIN'); }
      };
    };
    draw();
    m.tabIndex=-1; m.focus(); m.onkeydown=e=>{ if(/^[0-9]$/.test(e.key)) m.querySelector(`[data-k="${e.key}"]`).click(); if(e.key==='Backspace') m.querySelector('[data-k="b"]').click(); };
  });
}
function setPinFlow(after){
  pinPad('Choose a 4-digit PIN',async pin=>{ setPinFlow.first=pin; return true; },()=>{
    pinPad('Type it again',async pin=>pin===setPinFlow.first,async pin=>{ S.pinHash=await pinHashOf(pin); pinUntil=Date.now()+5*60e3; save(); toast('Settings PIN set'); after&&after(); },false);
  },false);
}

               :`<span class="pill-ok">${s.pdf?'📄':'📂'} ${s.count} entries · loaded ${s.at?fmtD(s.at,{day:'numeric',month:'short'}):''}</span>`}
        ${s.url?`<button class="xbtn" data-refresh="${s.id}">🔄 Update now</button>`:''}<button class="xbtn" data-rm="${s.id}">Remove</button></div>`).join('')||'<div class="srcline note">Nothing connected yet.</div>'}
      <div class="srcline">
        <button class="xbtn" data-link="${p.id}">🔗 Add a live link</button>
        <label class="xbtn">📂 Load a calendar file<input type="file" accept=".ics,text/calendar" data-file="${p.id}" data-type="cal" style="display:none"></label>
        ${p.traveller?`<button class="xbtn" data-pdf="${p.id}" style="background:#ffe5a8;font-weight:800">📄 Load roster PDF</button>`:''}
        <label class="xbtn">🏫 School calendar file<input type="file" accept=".ics,text/calendar" data-file="${p.id}" data-type="school" style="display:none"></label>
      </div></div>`).join('')}
    <div class="step">Where to find a calendar's link</div>
    <details class="how"><summary>Google Calendar</summary><ol><li>On a computer, open calendar.google.com.</li><li>⚙️ Settings → under “Settings for my calendars” click the calendar.</li><li>Scroll to “Integrate calendar” and copy <b>Secret address in iCal format</b>. Use 🔗 Add a live link. (For a file instead: Settings → Import &amp; export → Export.)</li></ol></details>
    <details class="how"><summary>Work roster (RosterBuster or the Air NZ calendar)</summary><ol><li>RosterBuster: Settings → Calendar → look for a <b>subscribe / iCal link</b> (calendar sync may need Premium). Use ✈️ Work roster when adding it.</li><li>No link? Export the roster as an <b>.ics</b> file and use ✈️ Load roster file each time a new roster comes out.</li></ol></details>
    <details class="how"><summary>School calendar</summary><ol><li>Look on the school website or app for “Subscribe”, “Add to calendar” or “iCal”.</li><li>A link goes in 🔗 Add a live link (choose 🏫 School). A file goes in 🏫 School calendar file.</li></ol></details>
    <details class="how"><summary>Outlook / Microsoft 365</summary><ol><li>Outlook on the web → ⚙️ Settings → Calendar → Shared calendars → <b>Publish a calendar</b>.</li><li>Pick the calendar and “Can view all details”, click Publish, and copy the <b>ICS</b> link. (Your employer may block this.)</li></ol></details>
    <p class="note">Repeating entries in these calendars come across as repeats too. A few unusual patterns (like “the 2nd Tuesday of each month”) show their first date only.</p>
    <div class="mact"><button class="save" id="ok">Done</button></div>`;
    const hg=m.querySelector('#helperGo')||m.querySelector('#helperRe'); if(hg) hg.onclick=()=>{ close(); openHelperSetup(()=>openSync()); };
    m.querySelectorAll('[data-link]').forEach(b=>b.onclick=()=>{ close(); openAddLink(b.dataset.link); });
    m.querySelectorAll('[data-pdf]').forEach(b=>b.onclick=()=>{ close(); pickRosterPdf(b.dataset.pdf); });
    m.querySelectorAll('[data-refresh]').forEach(b=>b.onclick=async()=>{ const src=S.sources.find(x=>x.id===b.dataset.refresh); b.textContent='Updating…';
      try{ const t=await fetchLink(src); applySource(src,parseICS(t,src.who,src.type==='roster',src.id)); src.err=''; toast(`Updated: ${src.count} entries`); }catch(e){ src.err=e.message||'could not update'; toast('Could not update: '+src.err); }
      save(); renderAll(); draw(); });
    m.querySelectorAll('[data-file]').forEach(inp=>inp.onchange=async e=>{
      const f=e.target.files[0]; if(!f) return; const who=inp.dataset.file, type=inp.dataset.type;
      const src={id:uid(),who,type,label:f.name};
      const r=parseICS(await f.text(),who,type==='roster',src.id);
      if(!r.flights.length&&!r.others.length){ toast('No entries found in that file'); return; }
      if(type==='roster'){ const old=S.sources.filter(s=>s.who===who&&s.type==='roster').map(s=>s.id); S.sources=S.sources.filter(s=>!old.includes(s.id)); S.events=S.events.filter(x=>!old.includes(x.src)); }
      applySource(src,r); S.sources.push(src);
      save(); renderAll(); draw(); toast(`Loaded ${r.flights.length?r.flights.length+' flights and ':''}${r.others.length} entries`);
    });
    m.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ const id=b.dataset.rm; const s=S.sources.find(x=>x.id===id); S.sources=S.sources.filter(x=>x.id!==id); S.events=S.events.filter(x=>x.src!==id); S.flights=S.flights.filter(x=>x.src!==id); if(s&&s.type==='roster') S.override=null; save(); renderAll(); draw(); });
    m.querySelector('#ok').onclick=close;
  }; draw(); });
}

/* ================= install on a phone, tablet or computer ================= */
let INSTALL_EVT=null;
function isInstalled(){ try{ return matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: window-controls-overlay)').matches||navigator.standalone===true; }catch(e){ return false; } }
/* pop-up offering to install Family Screen as an app on this computer / phone */
function offerInstall(){
  if(isInstalled()||document.getElementById('instOffer')) return;
  const snooze=lsGet('fs.installSnooze',0); if(snooze&&Date.now()<snooze) return;
  const ua=navigator.userAgent, ios=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const mobile=/Android|iPhone|iPad|iPod/.test(ua);
  if(!INSTALL_EVT&&!ios) return;                      // browser can't install (e.g. Firefox) or already installed
  const where=mobile?'this phone':'this computer';
  const d=document.createElement('div'); d.id='instOffer'; d.className='instOffer';
  d.innerHTML=`<img src="icon-192.png" alt=""><div class="io-t"><b>Install Family Screen on ${where}</b>
    <span>${mobile?'It goes on your home screen and opens like an app.':'It gets its own window and an icon on the desktop and Start menu, and opens like any other program.'} Works even when the internet drops out.</span>
    ${ios&&!INSTALL_EVT?'<span class="io-how">Tap the <b>Share</b> button ⬆️, then <b>Add to Home Screen</b>.</span>':''}</div>
    <div class="io-b">${INSTALL_EVT?'<button class="io-go" id="ioGo">Install</button>':''}<button class="io-no" id="ioNo">Not now</button></div>`;
  document.body.appendChild(d); requestAnimationFrame(()=>d.classList.add('show'));
  const go=d.querySelector('#ioGo'); if(go) go.onclick=async()=>{ const e=INSTALL_EVT; INSTALL_EVT=null; d.remove(); try{ e.prompt(); const r=await e.userChoice; if(r&&r.outcome!=='accepted') lsSet('fs.installSnooze',Date.now()+3*864e5); }catch(x){} };
  d.querySelector('#ioNo').onclick=()=>{ lsSet('fs.installSnooze',Date.now()+3*864e5); d.remove(); };
}
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); INSTALL_EVT=e; setTimeout(offerInstall,1200); });
window.addEventListener('appinstalled',()=>{ INSTALL_EVT=null; const d=document.getElementById('instOffer'); if(d) d.remove(); toast('Installed ✓ Find Family Screen on your desktop or Start menu'); });
setTimeout(offerInstall,2500);

function showInstall(){
  const ua=navigator.userAgent, ios=/iPhone|iPad|iPod/.test(ua), android=/Android/.test(ua), samsung=/SamsungBrowser/.test(ua);
  const steps=ios?['Tap the <b>Share</b> button (square with an arrow ⬆️).','Tap <b>Add to Home Screen</b>, then <b>Add</b>.']
    :samsung?['Tap the <b>☰</b> menu (bottom right).','Tap <b>Add page to → Home screen</b>, then <b>Add</b>.']
    :android?['Tap the <b>⋮</b> menu (top right).','Tap <b>Add to Home screen</b> or <b>Install app</b>, then <b>Install</b>.']
    :['Click the install icon at the right of the address bar,','or ⋮ → <b>Cast, save and share → Install page as app</b>.'];
  modal((m,close)=>{
    m.innerHTML=`<h2>📲 Install Family Screen</h2>${isInstalled()?'<p style="font-size:20px">✓ It\'s installed on this device.</p>':`
      <p class="note">Installing puts Family Screen on the home screen so it opens like an app and keeps working when the internet drops out.</p>

    <div class="pc-gridwrap" id="pcWrap"><div class="pc-grid" id="pcGrid">${cells}</div></div>
    <div class="pc-sheet" id="pcSheet"><div class="pc-grab"></div>
      <div class="ps-head" id="psHead"><b>${sel.getDate()}</b><span>${fmtD(sel,{weekday:'short'})}${pSel===todayK?' · Today':''}</span><span class="ps-mon">${fmtD(sel,{month:'short'})}</span><button id="psPrev" aria-label="Previous day">‹</button><button id="psNext" aria-label="Next day">›</button></div>
      ${T.allday?`<div class="ps-allday">${T.allday}</div>`:''}
      <div class="ps-scroll" id="psScroll">${T.tl}</div></div>`;
  // geometry
  const H=el.clientHeight, head=el.querySelector('.pc-head').offsetHeight, gridTop=head+el.querySelector('.pc-dow').offsetHeight;
  pSnaps={day:head, week:gridTop+ROW+6, split:gridTop+rows*ROW+6, month:H-96};
  if(pSnaps.month<pSnaps.split+40) pSnaps.month=pSnaps.split+40;
  const layout=(y,anim)=>{ pY=y; const sheet=$('#pcSheet'), wrap=$('#pcWrap'), grid=$('#pcGrid'); if(!sheet) return;
    const avail=Math.max(0,y-gridTop-6);
    let rowH=ROW, off=0;
    if(avail>=rows*ROW){ rowH=Math.min(avail/rows,160); } else { off=-Math.min(selRow*ROW,rows*ROW-avail); }
    [sheet,wrap,grid].forEach(x=>x.style.transition=anim?'all .26s ease':'none');
    sheet.style.top=y+'px'; wrap.style.height=avail+'px'; grid.style.transform=`translateY(${off}px)`;
    grid.style.gridAutoRows=rowH+'px'; grid.classList.toggle('titles',rowH>=92);
    el.querySelector('.pc-dow').style.opacity=y<=gridTop?0:1; };
  layout(pSnaps[pMode]??pSnaps.split,false);
  const sc=$('#psScroll'); sc.scrollTop=pScroll!=null?pScroll:T.scrollTo;
  // taps
  el.querySelectorAll('[data-pd]').forEach(b=>b.onclick=()=>{ if(suppressClick) return; const k=b.dataset.pd; if(k===pSel&&pMode==='month'){ setPMode('split'); return; } pSel=k; const d=kd(k); if(d.getMonth()!==pMonth.getMonth()) pMonth=new Date(d.getFullYear(),d.getMonth(),1); renderPCal(); updateFab(); });
  wirePvSeg(el);
  $('#pcPrev').onclick=()=>{ pMonth=new Date(pMonth.getFullYear(),pMonth.getMonth()-1,1); renderPCal(); };
  $('#pcNext').onclick=()=>{ pMonth=new Date(pMonth.getFullYear(),pMonth.getMonth()+1,1); renderPCal(); };
  $('#pcToday').onclick=()=>{ pSel=dk(new Date()); pMonth=null; renderPCal(); updateFab(); };
  const stepDay=n=>{ pSel=dk(addDays(kd(pSel),n)); const d=kd(pSel); if(d.getMonth()!==pMonth.getMonth()) pMonth=new Date(d.getFullYear(),d.getMonth(),1); renderPCal(); updateFab(); };
  $('#psPrev').onclick=e=>{ e.stopPropagation(); stepDay(-1); }; $('#psNext').onclick=e=>{ e.stopPropagation(); stepDay(1); };
  wireTimeline(el.querySelector('.pc-sheet'),pSel);
  // slide the day sheet with a finger: follows the finger, then settles on the nearest view
  const drag=(zone,needDecide)=>{ let st=null;
    zone.addEventListener('pointerdown',e=>{ if(e.target.closest('button')&&zone.id==='psHead') return; st={y0:e.clientY,x0:e.clientX,top0:pY,live:!needDecide,t0:Date.now(),id:e.pointerId}; if(st.live) zone.setPointerCapture(e.pointerId); });
    zone.addEventListener('pointermove',e=>{ if(!st) return; const dy=e.clientY-st.y0, dx=e.clientX-st.x0;
      if(!st.live){ if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)*1.3){ st.live=true; try{ zone.setPointerCapture(st.id); }catch(x){} } else if(Math.abs(dx)>12){ st=null; return; } else return; }
      layout(Math.max(pSnaps.day,Math.min(pSnaps.month,st.top0+dy)),false); });
    const end=()=>{ if(!st) return; const s=st; st=null; if(!s.live) return;
      suppressClick=true; setTimeout(()=>suppressClick=false,350);
      const moved=pY-s.top0, fast=Math.abs(moved)>30&&Date.now()-s.t0<300;
      let best=MODES.reduce((a,m)=>Math.abs(pSnaps[m]-pY)<Math.abs(pSnaps[a]-pY)?m:a,'split');
      const startMode=MODES.reduce((a,m)=>Math.abs(pSnaps[m]-s.top0)<Math.abs(pSnaps[a]-s.top0)?m:a,'split');
      if(fast&&best===startMode){ const i=MODES.indexOf(startMode); best=MODES[Math.max(0,Math.min(3,i+(moved>0?1:-1)))]; }
      pMode=best; lsSet('fs.pmode2',best); layout(pSnaps[best],true); };
    zone.addEventListener('pointerup',end); zone.addEventListener('pointercancel',end);
  };
  drag(el.querySelector('.pc-grab'),false); drag($('#psHead'),false); drag($('#pcWrap'),true);
}
function setPMode(m){ pMode=m; lsSet('fs.pmode2',m); renderPCal(); }
function dayLines(key){ return itemsForDay(key).map(it=>{
  if(it.k==='ev') return {c:evBg(it.e.whos),t:(it.e.priv?LOCK:'')+(it.e.time?t12(it.e.time).replace(':00','')+' ':'')+it.e.title};
  if(it.k==='away'){ const a=it.w.code?AIRPORTS[it.w.code]:null; return {c:col(it.who),t:a?'💼 '+a[0]:'✈️'}; }
  if(it.k==='arr') return {c:col(it.f.who),t:'🛬 '+fmtTime(fE(it.f),'Pacific/Auckland')};
  if(it.k==='taxi') return {c:col(it.f.who),t:'🚕 '+fmtTime(it.t,'Pacific/Auckland')};
  return {c:col(it.f.who),t:'✈️ '+it.f.from+'→'+it.f.to};
}); }
function updateFab(){ const f=$('#pcFab'); if(!f) return; const d=kd(pSel); f.innerHTML=`<span>Add on ${d.getDate()} ${fmtD(d,{month:'short'})}</span><b>＋</b>`; f.onclick=()=>openAdd({date:pSel}); }

/* swipe left / right to move between tabs */
const TABS=['cal','todo','shop','where'];
(function(){ let sx=0,sy=0,ok=false,t0=0;
  document.addEventListener('touchstart',e=>{ if(!isPhone()||e.touches.length!==1){ ok=false; return; }
    const el=e.target&&e.target.closest?e.target:document.body; ok=!el.closest('.scrim,.wheel,.space svg,input,textarea,.pc-grab,.instOffer,#gate,.pw-top,.pw-days,.pc-sheet,.fday')&&!(drag&&drag.live);
    sx=e.touches[0].clientX; sy=e.touches[0].clientY; t0=Date.now(); },{passive:true});
  document.addEventListener('touchend',e=>{ if(!ok||(drag&&drag.live)) return; const t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
    if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.8&&Date.now()-t0<700){ const i=TABS.indexOf(document.body.dataset.tab||'cal'), n=i+(dx<0?1:-1); if(n>=0&&n<TABS.length) setTab(TABS[n]); } },{passive:true});
})();

/* Android back button: close what's open, step back to the calendar, then ask before leaving */
// Chrome only honours a "back" entry if the page has been tapped since it was added, so the guard is
// (re)armed on load, after each back press, and again on the next tap whenever it's missing.
let backArmed=false, quitAsk=false;
const reguard=()=>{ if(history.state&&history.state.fs==='guard') return; history.pushState({fs:'guard'},''); backArmed=true; };
history.replaceState({fs:'base'},''); reguard();
['pointerdown','keydown'].forEach(t=>document.addEventListener(t,()=>{ if(!quitAsk&&!backArmed) reguard(); },true));
function askQuit(){
  quitAsk=true;
  modal((m,close)=>{ m.innerHTML=`<h2>Close Family Screen?</h2><p style="font-size:19px">Press <b>back</b> again to close it.</p><div class="mact"><button class="save" id="stay">Stay</button></div>`;
    m.querySelector('#stay').onclick=()=>{ quitAsk=false; close(); reguard(); }; });
  const L=$('#layer .scrim'); if(L) L.addEventListener('click',e=>{ if(e.target===L){ quitAsk=false; reguard(); } });
}
window.addEventListener('popstate',()=>{
  backArmed=false;
  if(quitAsk){ quitAsk=false; history.back(); return; }
  if($('#layer').innerHTML){ closeModal(); reguard(); return; }
  if($('#cookmode')){ $('#cookmode').remove(); reguard(); return; }
  if($('#mealLayer').innerHTML){ closeMeals(); if(isPhone()) setTab('cal',true); reguard(); return; }
  if(document.body.dataset.tab==='where'||$('#spaceLayer').innerHTML){ closeGlobe(); if(isPhone()) setTab('cal',true); reguard(); return; }
  if(isPhone()&&document.body.dataset.tab&&document.body.dataset.tab!=='cal'){ setTab('cal',true); reguard(); return; }
  if(isPhone()&&pView==='week'&&pwSnap!=='low'){ pwSnap='low'; lsSet('fs.pwsnap','low'); renderPCal(); reguard(); return; }
  if(isPhone()&&pView==='month'&&pMode==='month'){ setPMode('split'); reguard(); return; }
  askQuit();   // no guard now: one more back closes the app
});

/* ================= fridge layout: drag to resize, hide/show panels (saved on this device) ================= */
let LAY=Object.assign({t:340,s:360,r:400,hideT:false,hideS:false},lsGet('fs.layout',{}));
const saveLay=()=>lsSet('fs.layout',LAY);
function applyLayout(){
  const app=$('.app'); if(!app) return;
  const ph=isPhone(), wide=innerWidth>=1500;
  app.classList.toggle('hideT',!ph&&!!LAY.hideT); app.classList.toggle('hideS',!ph&&!!LAY.hideS);
  const dock=$('#dock'), nT=S.todos.filter(t=>!t.done).length, nS=S.groceries.filter(x=>!x.done).length;
  if(dock) dock.innerHTML=ph?'':(LAY.hideT?`<button class="dockp" data-showp="T" title="Show the to-do list"><span class="chev">«</span><span class="vt">✅ To do</span>${nT?`<span class="n">${nT}</span>`:''}</button>`:'')+(LAY.hideS?`<button class="dockp" data-showp="S" title="Show the shopping list"><span class="chev">«</span><span class="vt">🛒 Shopping</span>${nS?`<span class="n">${nS}</span>`:''}</button>`:'');
  document.querySelectorAll('[data-showp]').forEach(b=>b.onclick=()=>{ LAY['hide'+b.dataset.showp]=false; saveLay(); applyLayout(); });
  if(ph){ app.style.gridTemplateColumns=''; return; }
  const maxSide=Math.max(260,innerWidth-560-((LAY.hideT||LAY.hideS)?62:0));   // the calendar always keeps at least ~520px
  ['t','s','r'].forEach(k=>LAY[k]=Math.max(240,Math.min(maxSide,LAY[k])));
  if(wide&&!LAY.hideT&&!LAY.hideS&&LAY.t+LAY.s+28>maxSide){ const f=(maxSide-28)/(LAY.t+LAY.s); LAY.t=Math.max(240,Math.round(LAY.t*f)); LAY.s=Math.max(240,Math.round(LAY.s*f)); }
  let cols=['minmax(0,1fr)'];
  if(wide){ if(!LAY.hideT) cols.push('14px',LAY.t+'px'); if(!LAY.hideS) cols.push('14px',LAY.s+'px'); }
  else if(!(LAY.hideT&&LAY.hideS)) cols.push('14px',LAY.r+'px');
  if(LAY.hideT||LAY.hideS) cols.push('62px');
  app.style.gridTemplateColumns=cols.join(' ');
}
function initSplits(){
  document.querySelectorAll('.split').forEach(sp=>{
    sp.onpointerdown=e=>{
      e.preventDefault(); sp.setPointerCapture(e.pointerId); sp.classList.add('drag');
      const x0=e.clientX, wide=innerWidth>=1500, st={...LAY}, which=sp.dataset.split;
      const move=ev=>{ const dx=ev.clientX-x0;
        if(which==='b'){ const tot=st.t+st.s; LAY.t=Math.max(240,Math.min(tot-240,st.t+dx)); LAY.s=tot-LAY.t; }
        else if(wide){ if(!LAY.hideT) LAY.t=st.t-dx; else LAY.s=st.s-dx; }
        else LAY.r=st.r-dx;
        applyLayout(); };
      const up=()=>{ sp.classList.remove('drag'); sp.removeEventListener('pointermove',move); sp.removeEventListener('pointerup',up); sp.removeEventListener('pointercancel',up); saveLay(); if(typeof renderCal==='function') renderCal(); };
      sp.addEventListener('pointermove',move); sp.addEventListener('pointerup',up); sp.addEventListener('pointercancel',up);
    };
    sp.ondblclick=()=>{ Object.assign(LAY,{t:340,s:360,r:400}); saveLay(); applyLayout(); };
  });
  document.addEventListener('click',e=>{ const b=e.target.closest('[data-hidep]'); if(!b) return; LAY['hide'+b.dataset.hidep]=true; saveLay(); applyLayout(); toast('Minimised. Tap the strip on the right to open it again'); });
  addEventListener('resize',applyLayout); applyLayout();
}
// app shortcuts (long-press the app icon): ?open=cards|shop|add|where
let launchAct=(()=>{ try{ const v=new URLSearchParams(location.search).get('open'); if(v){ const q=new URLSearchParams(location.search); q.delete('open'); history.replaceState(history.state,'',location.pathname+(q.toString()?'?'+q:'')); } return v; }catch(e){ return null; } })();
function runLaunch(){ const a=launchAct; if(!a) return; launchAct=null;
  setTimeout(()=>{ if(a==='cards'){ if(isPhone()) setTab('shop'); if((S.cards||[]).length) openWallet(0); else requirePin(openCards); }
    else if(a==='shop'){ if(isPhone()) setTab('shop'); } else if(a==='add') openAdd(); else if(a==='where'){ if(isPhone()) setTab('where'); else openGlobe(); } },300); }
function renderAll(){ if(!S.people.length) return; if($('#mealLayer').innerHTML&&!$('#layer').innerHTML) openMeals(); setTimeout(askWhoAmI,1500); if(launchAct) runLaunch(); if(LAY.hideT||LAY.hideS) setTimeout(applyLayout,0); if(S.events.some(e=>e.roster&&e.title==='LOF')){ S.events=S.events.filter(e=>!(e.roster&&e.title==='LOF')); save(); } renderClock(); renderBar(); renderCal(); renderTodo(); renderShop(); renderPhoneTop(); renderPCal(); updateFab(); const tw=$('#tabWhere'); if(tw){ const tp=traveller(); tw.textContent=tp?tName(tp)+'?':'Where?'; } }
$('#addBtn').onclick=()=>openAdd(null);
$('#setBtn').onclick=()=>requirePin(openSettings);
$('#globeBtn').onclick=openGlobe;
$('#mealBtn').onclick=openMeals;
$('#tabMore').onclick=e=>{ e.stopPropagation(); openMore(); };
$('#moreBtn').onclick=openMore;
$('#askBtn').onclick=()=>openAsk();
$('#homeClock').onclick=openGlobe;
document.querySelectorAll('.tabbar [data-tab]').forEach(b=>{ if(b.dataset.tab!=='more') b.onclick=()=>setTab(b.dataset.tab); });
setTab((()=>{ try{ return sessionStorage.getItem('fs.tab')||'cal'; }catch(e){ return 'cal'; } })());
initSplits();
if(LOCAL){ gate(null); renderAll(); save(); setTimeout(()=>refreshLinks(false),2000); }
else {
  gate('loading');
  SYNC.init(CONFIG,{emulator:EMU});
  SYNC.watchAuth(u=>{ if(!u){ SYNC.stop(); gate('signin'); } else enterHome(); });
}
setInterval(()=>{ renderClock(); renderPhoneTop(); },15000);
/* stay up to date: when a new version is published, reload by itself (waits if someone is mid-edit) */
const FS_VERSION='/*@VERSION@*/';
let updateReady=false;
async function checkUpdate(){
  if(location.protocol!=='https:'||/[?&]demo/.test(location.search)) return;
  try{ const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'}); const v=(await r.json()).version; if(v&&v!==FS_VERSION){ updateReady=true; applyUpdate(); } }catch(e){}
}
function applyUpdate(){
  if(!updateReady) return;
  const busy=(drag&&drag.live)||$('#layer').innerHTML||document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if(busy){ setTimeout(applyUpdate,30000); return; }
  // make sure the new copy is in the cache before reloading (the page opens from the cache first)
  fetch('index.html?fresh=1',{cache:'no-cache'}).catch(()=>{}).finally(()=>location.reload());
}
setInterval(checkUpdate,5*60e3); setTimeout(checkUpdate,20e3);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') checkUpdate(); });
let lastDay=dk(new Date()); setInterval(()=>{ if(dk(new Date())!==lastDay){ lastDay=dk(new Date()); renderCal(); renderTodo(); } },60000);
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
