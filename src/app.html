/* ================= fridge layout: drag to resize, hide/show panels (saved on this device) ================= */
let LAY=Object.assign({t:340,s:360,r:400,hideT:false,hideS:false},lsGet('fs.layout',{}));
const saveLay=()=>lsSet('fs.layout',LAY);
function applyLayout(){
  const app=$('.app'); if(!app) return;
  const ph=isPhone(), wide=innerWidth>=1500;
  app.classList.toggle('hideT',!ph&&!!LAY.hideT); app.classList.toggle('hideS',!ph&&!!LAY.hideS);
  const dock=$('#dock'), nT=S.todos.filter(t=>!t.done).length, nS=S.groceries.filter(x=>!x.done).length;
  if(dock) dock.innerHTML=ph?'':(LAY.hideT?`<button class="dockp" data-showp="T" title="Show the to-do list"><span class="chev">«</span><span class="vt">✅ To do</span>${nT?`<span class="n">${nT}</span>`:''}</button>`:'')+(LAY.hideS?`<button class="dockp" data-showp="S" title="Show the shopping list"><span class="chev">«</span><span class="vt">🛒 Shopping</span>${nS?`<span class="n">${nS}</span>`:''}</button>`:'');
  document.querySelectorAll('[data-showp]').forEach(b=>b.onclick=()=>{ LAY['hide'+b.dataset.showp]=false; saveLay(); applyLayout(); });
  if(ph){ app.style.gridTemplateColumns=''; return; }
  const maxSide=Math.max(260,innerWidth-560-((LAY.hideT||LAY.hideS)?62:0));   // the calendar always keeps at least ~520px
  ['t','s','r'].forEach(k=>LAY[k]=Math.max(240,Math.min(maxSide,LAY[k])));
  if(wide&&!LAY.hideT&&!LAY.hideS&&LAY.t+LAY.s+28>maxSide){ const f=(maxSide-28)/(LAY.t+LAY.s); LAY.t=Math.max(240,Math.round(LAY.t*f)); LAY.s=Math.max(240,Math.round(LAY.s*f)); }
  let cols=['minmax(0,1fr)'];
  if(wide){ if(!LAY.hideT) cols.push('14px',LAY.t+'px'); if(!LAY.hideS) cols.push('14px',LAY.s+'px'); }
  else if(!(LAY.hideT&&LAY.hideS)) cols.push('14px',LAY.r+'px');
  if(LAY.hideT||LAY.hideS) cols.push('62px');
  app.style.gridTemplateColumns=cols.join(' ');
}
function initSplits(){
  document.querySelectorAll('.split').forEach(sp=>{
    sp.onpointerdown=e=>{
      e.preventDefault(); sp.setPointerCapture(e.pointerId); sp.classList.add('drag');
      const x0=e.clientX, wide=innerWidth>=1500, st={...LAY}, which=sp.dataset.split;
      const move=ev=>{ const dx=ev.clientX-x0;
        if(which==='b'){ const tot=st.t+st.s; LAY.t=Math.max(240,Math.min(tot-240,st.t+dx)); LAY.s=tot-LAY.t; }
        else if(wide){ if(!LAY.hideT) LAY.t=st.t-dx; else LAY.s=st.s-dx; }
        else LAY.r=st.r-dx;
        applyLayout(); };
      const up=()=>{ sp.classList.remove('drag'); sp.removeEventListener('pointermove',move); sp.removeEventListener('pointerup',up); sp.removeEventListener('pointercancel',up); saveLay(); if(typeof renderCal==='function') renderCal(); };
      sp.addEventListener('pointermove',move); sp.addEventListener('pointerup',up); sp.addEventListener('pointercancel',up);
    };
    sp.ondblclick=()=>{ Object.assign(LAY,{t:340,s:360,r:400}); saveLay(); applyLayout(); };
  });
  document.addEventListener('click',e=>{ const b=e.target.closest('[data-hidep]'); if(!b) return; LAY['hide'+b.dataset.hidep]=true; saveLay(); applyLayout(); toast('Minimised. Tap the strip on the right to open it again'); });
  addEventListener('resize',applyLayout); applyLayout();
}
function renderAll(){ if(!S.people.length) return; if(LAY.hideT||LAY.hideS) setTimeout(applyLayout,0); if(S.events.some(e=>e.roster&&e.title==='LOF')){ S.events=S.events.filter(e=>!(e.roster&&e.title==='LOF')); save(); } renderClock(); renderBar(); renderCal(); renderTodo(); renderShop(); renderPhoneTop(); renderPCal(); updateFab(); const tw=$('#tabWhere'); if(tw){ const tp=traveller(); tw.textContent=tp?`Where's ${tName(tp)}?`:'Where?'; } }
$('#addBtn').onclick=()=>openAdd(null);
$('#setBtn').onclick=()=>requirePin(openSettings);
$('#globeBtn').onclick=openGlobe;
$('#homeClock').onclick=openGlobe;
document.querySelectorAll('.tabbar [data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
setTab((()=>{ try{ return sessionStorage.getItem('fs.tab')||'cal'; }catch(e){ return 'cal'; } })());
initSplits();
if(LOCAL){ gate(null); renderAll(); save(); setTimeout(()=>refreshLinks(false),2000); }
else {
  gate('loading');
  SYNC.init(CONFIG,{emulator:EMU});
  SYNC.watchAuth(u=>{ if(!u){ SYNC.stop(); gate('signin'); } else enterHome(); });
}
setInterval(()=>{ renderClock(); renderPhoneTop(); },15000);
/* stay up to date: when a new version is published, reload by itself (waits if someone is mid-edit) */
const FS_VERSION='/*@VERSION@*/';
let updateReady=false;
async function checkUpdate(){
  if(location.protocol!=='https:'||/[?&]demo/.test(location.search)) return;
  try{ const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'}); const v=(await r.json()).version; if(v&&v!==FS_VERSION){ updateReady=true; applyUpdate(); } }catch(e){}
}
function applyUpdate(){
  if(!updateReady) return;
  const busy=(drag&&drag.live)||$('#layer').innerHTML||document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if(busy){ setTimeout(applyUpdate,30000); return; }
  location.reload();
}
setInterval(checkUpdate,5*60e3); setTimeout(checkUpdate,20e3);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') checkUpdate(); });
let lastDay=dk(new Date()); setInterval(()=>{ if(dk(new Date())!==lastDay){ lastDay=dk(new Date()); renderCal(); renderTodo(); } },60000);
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
